name: "CodeQL"

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    # The solution has WPF and WinUI apps, so the job must run on Windows.
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # The build downloads about 100 MB of FFmpeg. The cache avoids this on each run.
    # The key must change when the FFmpeg version in Get-FFmpeg.ps1 changes.
    - name: Cache FFmpeg
      uses: actions/cache@v6
      with:
        path: ClipChopper/Applications/ClipChopper.WinUIApp/FFmpeg
        key: ffmpeg-9.0.2-${{ runner.os }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # A manual build lets the job set the solution, the configuration and the platform.
        build-mode: manual

    - name: Build
      run: dotnet build ClipChopper/ClipChopper.sln -c Release -p:Platform=x64

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
